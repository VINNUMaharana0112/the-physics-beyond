  <radialGradient id="glow"><stop stop-color="#1B4D79" stop-opacity=".52"/><stop offset="1" stop-color="#0A1423" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE4A3"/><stop offset=".48" stop-color="#E8B65A"/><stop offset="1" stop-color="#A96A27"/></linearGradient>
