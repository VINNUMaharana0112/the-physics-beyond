  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4DA3FF" stop-opacity="0"/><stop offset=".5" stop-color="#4DA3FF" stop-opacity=".9"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
