<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#1B4D79" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0A1423" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="140" y1="110" x2="520" y2="535" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE4A3"/>
      <stop offset=".48" stop-color="#E8B65A"/>
      <stop offset="1" stop-color="#A96A27"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0" cy="0" r="1" gradientTransform="translate(320 320) rotate(90) scale(22)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE4A3"/>
      <stop offset="1" stop-color="#C58A37"/>
    </radialGradient>
  </defs>

  <circle cx="320" cy="320" r="300" fill="url(#glow)"/>
  <g stroke="url(#orbit)" stroke-width="5" opacity=".9">
    <ellipse cx="320" cy="320" rx="236" ry="91" transform="rotate(-32 320 320)"/>
    <ellipse cx="320" cy="320" rx="236" ry="91" transform="rotate(32 320 320)"/>
    <ellipse cx="320" cy="320" rx="236" ry="91" transform="rotate(90 320 320)"/>
  </g>
  <circle cx="320" cy="320" r="20" fill="url(#nucleus)"/>
  <circle cx="320" cy="229" r="8" fill="#FFE4A3"/>
  <circle cx="180" cy="316" r="7" fill="#FF8B35"/>
</svg>
